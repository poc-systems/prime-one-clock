<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Prime One Clock</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P1 Clock">
<meta name="theme-color" content="#161C27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#242D3C; --deep:#161C27; --deep2:#1B2230; --silver:#A9AFB8; --steel:#5B636F; --lsilver:#D5D9E0;
  --hair:#E2E5EA; --mist:#F3F4F6; --white:#fff; --red:#B42318; --green:#2E7D5B; --amber:#B7791F;
  --line-d:rgba(169,175,184,.22); --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --label:'Michroma','Inter',sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--deep);color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;font-feature-settings:"tnum" 1}
input,textarea,select{user-select:text;-webkit-user-select:text;font:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.label{font-family:var(--label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver)}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb)}

/* ---------- kiosk header ---------- */
.top{display:flex;align-items:center;gap:18px;padding:22px 32px 18px;border-bottom:1px solid var(--line-d)}
.top svg.mark{width:30px;height:36px;flex:none}
.top .store{flex:1;min-width:0}
.top .store .name{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.clock{text-align:right}
.clock .t{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1}
.clock .d{color:var(--silver);font-size:13px;margin-top:6px}

/* ---------- name tiles ---------- */
.roster{flex:1;overflow:auto;padding:24px 32px;-webkit-overflow-scrolling:touch}
.roster h2{font-size:15px;font-weight:500;color:var(--lsilver);margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{position:relative;text-align:left;background:var(--deep2);border:1px solid var(--line-d);padding:20px 18px 18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;transition:background .2s,border-color .2s}
.tile:active{background:var(--navy);border-color:var(--silver)}
.tile .init{font-family:var(--label);font-size:15px;letter-spacing:.08em;color:var(--silver)}
.tile .nm{font-size:20px;font-weight:600;line-height:1.2;margin-top:14px}
.tile .st{font-size:13px;color:var(--silver);margin-top:6px;display:flex;align-items:center;gap:8px}
.tile .st i{width:8px;height:8px;background:#4B5361;display:inline-block}
.tile.in{border-color:rgba(46,125,91,.55)}
.tile.in .st i{background:#3FA57A}
.tile.in .st{color:#B9E3CF}
.tile.mgr .init::after{content:" · MGR";color:var(--steel)}
.empty{color:var(--silver);padding:40px 0;font-size:16px;line-height:1.6}

.bar{display:flex;gap:1px;border-top:1px solid var(--line-d);background:var(--line-d)}
.bar button{flex:1;background:var(--deep);padding:22px 10px;font-size:15px;font-weight:500;color:var(--lsilver);display:flex;align-items:center;justify-content:center;gap:10px}
.bar button:active{background:var(--navy)}
.bar svg{width:22px;height:22px}

/* ---------- overlay sheets (PIN, action, fix, manager) ---------- */
.sheet{position:fixed;inset:0;background:rgba(10,13,19,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{background:var(--deep);border:1px solid var(--line-d);width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;position:relative;animation:rise .35s ease}
.panel.wide{width:min(760px,100%)}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.panel header{display:flex;align-items:flex-start;justify-content:space-between;padding:26px 28px 0}
.panel header h3{font-size:26px;font-weight:600;margin-top:8px;line-height:1.15}
.x{width:44px;height:44px;margin:-8px -10px 0 0;display:flex;align-items:center;justify-content:center;color:var(--silver)}
.x svg{width:24px;height:24px}
.body{padding:22px 28px 28px}

.cam{position:relative;width:180px;height:180px;margin:0 auto 20px;background:#0E131B;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 82%,82% 100%,0 100%)}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .nocam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--steel);font-size:13px;padding:14px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
.dots span{width:46px;height:56px;border:1px solid var(--line-d);display:flex;align-items:center;justify-content:center;font-size:26px}
.dots span.on::after{content:"";width:12px;height:12px;background:#fff}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
.pad button{height:72px;border:1px solid var(--line-d);font-size:28px;font-weight:500}
.pad button:active{background:var(--navy)}
.pad button.fn{font-size:14px;color:var(--silver)}
.msg{min-height:22px;text-align:center;color:#F1A9A0;font-size:15px;margin:14px 0 0}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:8px}
.inp{width:100%;background:#0E131B;border:1px solid var(--line-d);color:#fff;padding:16px;font-size:18px;outline:none;border-radius:0;-webkit-appearance:none}
.inp:focus{border-color:var(--silver)}
textarea.inp{min-height:90px;resize:vertical}

.big{width:100%;padding:24px;font-size:22px;font-weight:600;background:#fff;color:var(--deep);display:flex;align-items:center;justify-content:center;gap:12px}
.big:active{background:var(--lsilver)}
.big.out{background:var(--navy);color:#fff;border:1px solid var(--silver)}
.big[disabled]{opacity:.5}
.ghost{width:100%;padding:16px;margin-top:12px;border:1px solid var(--line-d);color:var(--lsilver);font-size:16px}
.ghost:active{background:var(--navy)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.status{font-size:17px;color:var(--lsilver);margin:6px 0 24px;line-height:1.5}
.warn{border-left:2px solid var(--amber);padding:10px 14px;color:#F0D5A8;font-size:15px;margin-bottom:18px;background:rgba(183,121,31,.08)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line-d);padding:16px 10px;font-size:15px;color:var(--lsilver)}
.seg button.on{background:#fff;color:var(--deep);border-color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line-d);padding:12px 14px;font-size:15px;color:var(--lsilver)}
.chips button.on{background:#fff;color:var(--deep);border-color:#fff;font-weight:600}

.done{text-align:center;padding:50px 28px 44px}
.done svg{width:76px;height:76px;color:#3FA57A}
.done h3{font-size:32px;font-weight:600;margin-top:18px}
.done p{color:var(--lsilver);font-size:18px;margin-top:10px}

.list{border-top:1px solid var(--line-d)}
.item{border-bottom:1px solid var(--line-d);padding:16px 0}
.item .a{font-weight:600;font-size:16px}
.item .b{color:var(--silver);font-size:14px;margin-top:4px;line-height:1.5}
.item .acts{display:flex;gap:8px;margin-top:12px}
.item .acts button{flex:1;padding:12px;border:1px solid var(--line-d);font-size:15px}
.item .acts button.ok{background:#fff;color:var(--deep);border-color:#fff;font-weight:600}
.sub{margin:22px 0 10px}

.toast{position:fixed;left:50%;bottom:calc(30px + var(--sb));transform:translateX(-50%);background:#fff;color:var(--deep);padding:14px 22px;font-size:15px;font-weight:500;z-index:50;max-width:90%;animation:rise .3s}
.spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite;display:inline-block}
.big .spin{border-color:rgba(22,28,39,.2);border-top-color:var(--deep)}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- setup ---------- */
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:28px}
.setup{width:min(440px,100%)}
.setup .logo{width:150px;margin-bottom:34px}
.setup h1{font-size:30px;font-weight:600;margin:10px 0 10px}
.setup p{color:var(--lsilver);line-height:1.55;margin-bottom:26px}
.link{color:var(--silver);text-decoration:underline;text-underline-offset:4px;margin-top:26px;font-size:15px}

/* ---------- office (light) ---------- */
.office{background:var(--mist);color:var(--navy)}
.office .label{color:var(--steel)}
.otop{background:#fff;border-bottom:1px solid var(--hair);padding:16px 24px;display:flex;align-items:center;gap:16px}
.otop svg.mark{width:24px;height:28px}
.otop .who{flex:1}
.otop .who b{display:block;font-size:17px;margin-top:3px}
.otop button{border:1px solid var(--hair);padding:10px 14px;font-size:14px;color:var(--steel)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--hair);padding:0 16px;overflow-x:auto}
.tabs button{padding:14px 14px;font-size:15px;color:var(--steel);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.tabs .n{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;background:var(--amber);color:#fff;font-size:12px}
.ocontent{flex:1;overflow:auto;padding:20px 24px 40px;-webkit-overflow-scrolling:touch}
.card{background:#fff;border:1px solid var(--hair);padding:18px 20px;margin-bottom:12px}
.card h4{font-size:17px;font-weight:600}
.card .meta{color:var(--steel);font-size:14px;margin-top:4px;line-height:1.55}
.obtn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:11px 16px;font-size:14px;font-weight:500}
.obtn.alt{background:#fff;color:var(--navy);border-color:var(--hair)}
.obtn.red{background:#fff;color:var(--red);border-color:#F0C9C5}
.obtn:active{opacity:.8}
.oinp{border:1px solid var(--hair);background:#fff;padding:11px 12px;font-size:15px;color:var(--navy);border-radius:0;-webkit-appearance:none;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.tools .sp{flex:1}
.pill{display:inline-block;font-size:12px;padding:3px 8px;margin:2px 4px 2px 0;border:1px solid var(--hair);color:var(--steel)}
.pill.r{border-color:#F0C9C5;color:var(--red)}
.pill.a{border-color:#EBD6B0;color:var(--amber)}
.pill.g{border-color:#BFDCCD;color:var(--green)}
.person{background:#fff;border:1px solid var(--hair);margin-bottom:10px}
.person>button{width:100%;text-align:left;padding:16px 18px;display:flex;align-items:center;gap:12px}
.person .pn{flex:1;min-width:0}
.person .pn b{font-size:16px}
.person .pn div{color:var(--steel);font-size:13px;margin-top:3px}
.person .hrs{font-size:22px;font-weight:600}
.days{border-top:1px solid var(--hair)}
.day{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:12px 18px;border-bottom:1px solid var(--hair)}
.day:last-child{border-bottom:0}
.day .dn{font-weight:600;font-size:14px}
.day .dn small{display:block;color:var(--steel);font-weight:400;margin-top:2px}
.pch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);padding:7px 10px;margin:0 6px 6px 0;font-size:14px;color:var(--navy);background:#fff}
.pch.v{text-decoration:line-through;color:var(--silver)}
.pch .ty{font-family:var(--label);font-size:9px;letter-spacing:.12em;color:var(--steel)}
.pch.fx{border-style:dashed}
.addp{font-size:13px;color:var(--steel);text-decoration:underline;padding:7px 4px}
.dsum{font-size:13px;color:var(--steel);margin-top:2px}
.osheet{position:fixed;inset:0;background:rgba(22,28,39,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
@media(min-width:700px){.osheet{align-items:center}}
.opanel{background:#fff;width:min(520px,100%);padding:24px;max-height:90%;overflow:auto;animation:rise .3s}
.opanel h3{font-size:20px;margin:6px 0 16px}
.opanel .f{margin-bottom:14px}
.opanel .f label{display:block;margin-bottom:6px}
.opanel .f .oinp{width:100%}
.opanel .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.opanel .acts>*{flex:1}
.code{font-size:46px;font-weight:600;letter-spacing:.12em;margin:10px 0}
.oempty{color:var(--steel);padding:30px 0;text-align:center}
.olist .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.olist .row:last-child{border-bottom:0}
.dot{width:8px;height:8px;display:inline-block;margin-right:8px;background:#C9CED6}
.dot.in{background:var(--green)}
.office .toast{background:var(--navy);color:#fff}
.office .spin{border-color:rgba(36,45,60,.2);border-top-color:var(--navy)}
@media(max-width:600px){
  .top{padding:16px 18px 14px;gap:12px}.clock .t{font-size:24px}.clock .d{display:none}.top .store .name{font-size:16px;white-space:normal}.roster{padding:18px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:112px;padding:16px 14px}.tile .nm{font-size:17px}
  .bar button{font-size:13px;padding:18px 6px;flex-direction:column;gap:6px}
  .ocontent{padding:16px}.day{grid-template-columns:56px 1fr;padding:12px}
}
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="setup" class="screen hidden">
  <div class="center"><div class="setup">
    <svg class="logo" viewBox="211 199 624 736" aria-label="Prime One"><path fill="#fff" fill-rule="evenodd" id="logoPath"/></svg>
    <div class="label">Time clock</div>
    <h1>Set up this device</h1>
    <p>Enter the 6-digit setup code from the office. This links this iPad or phone to one store. It only needs to be done once.</p>
    <div class="field"><label class="label" for="setupCode">Setup code</label><input id="setupCode" class="inp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div>
    <div class="field"><label class="label" for="setupName">Device name (optional)</label><input id="setupName" class="inp" maxlength="60" placeholder="e.g. Wendell iPad"></div>
    <button class="big" id="setupGo">Activate</button>
    <div class="msg" id="setupMsg"></div>
    <button class="link" id="toOffice">Office sign in</button>
  </div></div>
</section>

<!-- ============ KIOSK ============ -->
<section id="kiosk" class="screen hidden">
  <div class="top">
    <svg class="mark" viewBox="285 195 515 580" id="markBtn"><path fill="#fff" id="markPath1"/></svg>
    <div class="store"><div class="label">Time clock</div><div class="name" id="storeName">Prime One</div></div>
    <div class="clock"><div class="t" id="clockT">--:--</div><div class="d" id="clockD"></div></div>
  </div>
  <div class="roster">
    <h2>Tap your name</h2>
    <div class="tiles" id="tiles"></div>
    <div class="empty hidden" id="emptyRoster"></div>
  </div>
  <div class="bar">
    <button id="btnOther"><svg viewBox="0 0 256 256"><path fill="currentColor" d="M128 28a100 100 0 1 0 100 100A100.11 100.11 0 0 0 128 28Zm0 192a92 92 0 1 1 92-92 92.1 92.1 0 0 1-92 92Zm4-52a8 8 0 1 1-8-8 8 8 0 0 1 8 8Zm24-60c0 15.6-12.68 26.76-28 27.93V144a4 4 0 0 1-8 0v-12a4 4 0 0 1 4-4c13.23 0 24-8.61 24-20s-10.77-20-24-20-24 8.61-24 20a4 4 0 0 1-8 0c0-15.44 14.36-28 32-28s32 12.56 32 28Z"/></svg>Not on the list?</button>
    <button id="btnFix"><svg viewBox="0 0 256 256"><path fill="currentColor" d="M128 28a100 100 0 1 0 100 100A100.11 100.11 0 0 0 128 28Zm0 192a92 92 0 1 1 92-92 92.1 92.1 0 0 1-92 92Zm60-92a4 4 0 0 1-4 4h-56a4 4 0 0 1-4-4V72a4 4 0 0 1 8 0v52h52a4 4 0 0 1 4 4Z"/></svg>Fix a punch</button>
    <button id="btnMgr"><svg viewBox="0 0 256 256"><path fill="currentColor" d="M208 44H48a12 12 0 0 0-12 12v56c0 54.65 26.65 87.86 49 106.15 24.28 19.87 48.17 26.62 49.17 26.9a3.94 3.94 0 0 0 2.12 0c1-.28 24.89-7 49.17-26.9C207.35 199.86 234 166.65 234 112V56a12 12 0 0 0-12-12Zm4 68c0 42.07-17.44 76-51.83 100.89A139.86 139.86 0 0 1 128 228.88a139.86 139.86 0 0 1-32.17-16C61.44 188 44 154.07 44 112V56a4 4 0 0 1 4-4h160a4 4 0 0 1 4 4Zm-38.83-12.83a4 4 0 0 1 0 5.66l-56 56a4 4 0 0 1-5.66 0l-24-24a4 4 0 0 1 5.66-5.66L114 152.34l53.17-53.17a4 4 0 0 1 5.66 0Z"/></svg>Manager</button>
  </div>
</section>

<!-- ============ OFFICE ============ -->
<section id="office" class="screen office hidden">
  <div class="otop">
    <svg class="mark" viewBox="285 195 515 580"><path fill="#242D3C" id="markPath2"/></svg>
    <div class="who"><div class="label">Time clock · Office</div><b id="offWho"></b></div>
    <button id="offRefresh">Refresh</button>
    <button id="offOut">Sign out</button>
  </div>
  <div class="tabs" id="offTabs">
    <button data-t="today" class="on">Today</button>
    <button data-t="fixes">Fixes<span class="n hidden" id="fixN"></span></button>
    <button data-t="week">Timesheets</button>
    <button data-t="devices">Devices</button>
  </div>
  <div class="ocontent" id="offBody"></div>
</section>

<div id="layer"></div>

<script>
/* =====================================================================
   Prime One Clock — store time clock app
   ===================================================================== */
const API = 'https://script.google.com/macros/s/AKfycbydVwLXDXG32NuNhdby4ucyC0sv934W6ss4ihDcg8YiR8RNk-ZUXR4D1oIRhnrfWVO4Mg/exec';

/* ---------------- API ---------------- */
async function api(action, data) {
  const body = Object.assign({ action }, data || {});
  if (!body.device && store.get('p1.device')) body.device = store.get('p1.device');
  let res;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
    res = await r.json();
  } catch (e) {
    throw new Error(navigator.onLine === false ? 'No internet connection. Check the connection and try again.' : 'Could not reach the time clock. Try again.');
  }
  if (res.appVersion && res.appVersion !== VERSION) NEEDS_UPDATE = true;
  if (!res.ok) {
    if (res.error === 'DEVICE_NOT_SET_UP') { store.del('p1.device'); show('setup'); throw new Error('This device is not set up. Enter a setup code.'); }
    throw new Error(res.error || 'Something went wrong.');
  }
  return res;
}

/* ---------------- screens ---------------- */
function show(id) {
  ['setup','kiosk','office'].forEach(s => $('#' + s).classList.toggle('hidden', s !== id));
  closeLayer();
}
function toast(t, ms) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  if (!$('#office').classList.contains('hidden')) { el.style.background = '#242D3C'; el.style.color = '#fff'; }
  document.body.appendChild(el); setTimeout(() => el.remove(), ms || 2600);
}
function openLayer(html, cls) {
  closeLayer(true);
  $('#layer').innerHTML = '<div class="' + (cls || 'sheet') + '">' + html + '</div>';
  return $('#layer').firstElementChild;
}
function closeLayer(keepCam) {
  $('#layer').innerHTML = '';
  if (!keepCam) stopCam();
}

/* ---------------- clock ---------------- */
function tick() {
  const d = new Date();
  $('#clockT').textContent = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  $('#clockD').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
setInterval(tick, 1000);

function initials(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function isMgrRole(r) { return /manager|president|officer/i.test(r || ''); }

function pickPerson(label, title, list, cb, allowPhone) {
  const el = openLayer(
    '<div class="panel"><header><div><div class="label">' + esc(label) + '</div><h3>' + esc(title) + '</h3></div><button class="x" data-close>' + ICON.x + '</button></header>' +

    '</div>' + (allowPhone || !list.length ? '<button class="ghost" data-phone>Not listed? Use my phone number</button>' : '') + '</div></div>');
  el.querySelector('[data-close]').onclick = () => closeLayer();
  el.querySelectorAll('.tile').forEach(b => b.onclick = () => cb(list.find(x => x.id === b.dataset.id)));
  const ph = el.querySelector('[data-phone]');
  if (ph) ph.onclick = () => cb({ byPhone: true });

/* ---------------- camera ---------------- */
let CAM = null;
async function startCam(box) {
  const v = box.querySelector('video');
  try {
    if (!CAM) CAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } }, audio: false });
    v.srcObject = CAM; v.setAttribute('playsinline', ''); v.muted = true; await v.play();
    box.querySelector('.nocam').classList.add('hidden');
  } catch (e) {
    box.querySelector('.nocam').textContent = 'Camera is off. The punch will be saved without a photo.';
  }
}
function stopCam() { if (CAM) { CAM.getTracks().forEach(t => t.stop()); CAM = null; } }
function snap() {
  const v = document.querySelector('#layer video');
  if (!v || !v.videoWidth) return '';
  const s = Math.min(v.videoWidth, v.videoHeight), c = document.createElement('canvas');
  c.width = c.height = 240;
  c.getContext('2d').drawImage(v, (v.videoWidth - s) / 2, (v.videoHeight - s) / 2, s, s, 0, 0, 240, 240);
  return c.toDataURL('image/jpeg', 0.62);
}

/* ---------------- PIN ---------------- */
function pinSheet(o) {
  if (o.byPhone && !o.employeeId) o.title = o.title || 'Enter your phone and PIN';
  const el = openLayer(
    '<div class="panel"><header><div><div class="label">' + (o.next === 'mgr' ? 'Manager' : o.next === 'fix' ? 'Fix a punch' : 'Enter your PIN') + '</div><h3>' + esc(o.title) + '</h3></div><button class="x" data-close>' + ICON.x + '</button></header>' +
    '<div class="body">' +
    (o.next === 'punch' ? '<div class="cam"><video playsinline muted></video><div class="nocam">Starting camera…</div></div>' : '') +
    (o.byPhone ? '<div class="field"><label class="label">Cell number</label><input class="inp" id="pPhone" inputmode="tel" maxlength="14" placeholder="(000) 000-0000"></div>' : '') +
    '<div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>' +
    '<div class="pad">' + [1,2,3,4,5,6,7,8,9].map(n => '<button data-k="' + n + '">' + n + '</button>').join('') +
    '<button class="fn" data-k="c">Clear</button><button data-k="0">0</button><button class="fn" data-k="b">Delete</button></div>' +
    '<div class="msg" id="pMsg"></div></div></div>');
  el.querySelector('[data-close]').onclick = () => closeLayer();
  if (o.next === 'punch') startCam(el.querySelector('.cam'));
  let pin = '', busy = false;
  const draw = () => el.querySelectorAll('#dots span').forEach((s, i) => s.classList.toggle('on', i < pin.length));
  el.querySelectorAll('.pad button').forEach(b => b.onclick = async () => {
    if (busy) return;
    const k = b.dataset.k;
    if (k === 'c') pin = ''; else if (k === 'b') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
    draw(); $('#pMsg').textContent = '';
    if (pin.length === 4) {
      busy = true; $('#pMsg').innerHTML = '<span class="spin"></span>';
      try {
        const r = await api('verify', { employeeId: o.employeeId || '', phone: o.byPhone ? ($('#pPhone') || {}).value : '', pin });
        if (o.next === 'punch') actionSheet(r);
        else if (o.next === 'fix') fixSheet(r, null);
        else if (o.next === 'mgr') { if (!r.isManager) throw new Error('Managers only.'); mgrSheet(r); }
      } catch (e) {
        $('#pMsg').textContent = e.message; pin = ''; draw(); busy = false;
        const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
      }
    }
  });
}

/* ---------------- clock in / out ---------------- */
function actionSheet(r) {
  const goingIn = r.status !== 'in';
  const hour = new Date().getHours();
  const hello = (hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening') + ', ' + r.firstName;
  // keep the camera running: move the live video into the new panel
  const el = openLayer(
    '<div class="panel"><header><div><div class="label">' + (goingIn ? 'Clock in' : 'Clock out') + '</div><h3>' + esc(hello) + '</h3></div><button class="x" data-close>' + ICON.x + '</button></header>' +
    '<div class="body"><div class="cam"><video playsinline muted></video><div class="nocam">Starting camera…</div></div>' +
    (r.openSince ? '<div class="warn">Your clock-in on ' + esc(r.openSince) + ' has no clock-out. Clock in now, then use “Fix a punch” to add the missing clock-out.</div>' : '') +
    '<div class="status">' + (goingIn ? (r.sinceLabel ? 'Last clock-out: ' + esc(r.sinceLabel) : 'Ready to start your day.') : 'Clocked in since ' + esc(r.sinceLabel) + '.') + '</div>' +
    (r.clocksIn ? '<button class="big ' + (goingIn ? '' : 'out') + '" id="doPunch">' + (goingIn ? 'Clock in' : 'Clock out') + '</button>' : '<div class="warn">You are not set up to clock in. Ask the office.</div>') +
    '<button class="ghost" id="toFix">Fix a punch instead</button>' +
    '<div class="msg" id="aMsg"></div></div></div>');
  startCam(el.querySelector('.cam'));
  el.querySelector('[data-close]').onclick = () => closeLayer();
  el.querySelector('#toFix').onclick = () => fixSheet(r, null);
  const b = el.querySelector('#doPunch');
  if (b) b.onclick = async () => {
    b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    const photo = snap();
    try {
      const p = await api('punch', { ticket: r.ticket, type: goingIn ? 'IN' : 'OUT', photo });
      doneSheet(goingIn ? 'You’re clocked in' : 'You’re clocked out', p.name + ' · ' + p.time + (photo ? '' : ' · no photo'));
      loadRoster(true);
    } catch (e) { $('#aMsg').textContent = e.message; b.disabled = false; b.textContent = goingIn ? 'Clock in' : 'Clock out'; }
  };
}
function doneSheet(title, sub) {
  stopCam();
  openLayer('<div class="panel"><div class="done">' + ICON.check + '<h3>' + esc(title) + '</h3><p>' + esc(sub) + '</p></div></div>');
  setTimeout(() => closeLayer(), 3200);
}

/* ---------------- fix a punch ---------------- */
const KINDS = ['Missed clock in', 'Missed clock out', 'Wrong time', 'Remove punch'];
function lastDays(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    if (d.getDay() === 0) continue; // nobody works Sunday
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    out.push({ iso, label: i === 0 ? 'Today' : i === 1 ? 'Yesterday' : d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' }) });
  }
  return out;
}
function fixSheet(r, forPerson) {
  stopCam();
  const target = forPerson || { id: r.employeeId, name: r.name, recent: r.recent };
  const days = lastDays(8);
  const st = { kind: '', date: days[0].iso, punch: '', };
  const el = openLayer(
    '<div class="panel wide"><header><div><div class="label">Fix a punch' + (forPerson ? ' · filed by ' + esc(r.name) : '') + '</div><h3>' + esc(target.name) + '</h3></div><button class="x" data-close>' + ICON.x + '</button></header>' +
    '<div class="body">' +
    '<div class="field"><label class="label">What happened?</label><div class="seg" id="fKind">' + KINDS.map(k => '<button data-v="' + k + '">' + k + '</button>').join('') + '</div></div>' +
    '<div class="field"><label class="label">Day</label><div class="chips" id="fDay">' + days.map((d, i) => '<button data-v="' + d.iso + '"' + (i === 0 ? ' class="on"' : '') + '>' + d.label + '</button>').join('') + '</div></div>' +
    '<div class="field hidden" id="fPunchF"><label class="label">Which punch?</label><div class="chips" id="fPunch"></div></div>' +
    '<div class="field hidden" id="fTimeF"><label class="label">Correct time</label><input type="time" class="inp" id="fTime"></div>' +
    '<div class="field"><label class="label">Reason</label><textarea class="inp" id="fReason" maxlength="500" placeholder="e.g. iPad was not working when I arrived"></textarea></div>' +
    '<button class="big" id="fSend">Send</button><div class="msg" id="fMsg"></div></div></div>');
  el.querySelector('[data-close]').onclick = () => closeLayer();
  const recent = target.recent || [];
  const refresh = () => {
    el.querySelectorAll('#fKind button').forEach(b => b.classList.toggle('on', b.dataset.v === st.kind));
    el.querySelectorAll('#fDay button').forEach(b => b.classList.toggle('on', b.dataset.v === st.date));
    const needPunch = st.kind === 'Wrong time' || st.kind === 'Remove punch';
    $('#fPunchF').classList.toggle('hidden', !needPunch);
    $('#fTimeF').classList.toggle('hidden', !st.kind || st.kind === 'Remove punch');
    const list = recent.filter(p => p.date === st.date);
    $('#fPunch').innerHTML = list.length ? list.map(p => '<button data-v="' + p.id + '"' + (p.id === st.punch ? ' class="on"' : '') + '>' + (p.type === 'IN' ? 'In ' : 'Out ') + esc(p.time) + '</button>').join('') : '<span style="color:var(--silver)">No punches on this day.</span>';
    el.querySelectorAll('#fPunch button').forEach(b => b.onclick = () => { st.punch = b.dataset.v; refresh(); });
  };
  el.querySelectorAll('#fKind button').forEach(b => b.onclick = () => { st.kind = b.dataset.v; st.punch = ''; refresh(); });

/* ---- Today: who is in, who is late, who has no punch ---- */
async function renderToday() {
  $('#offBody').innerHTML = '<div class="oempty"><span class="spin"></span></div>';

  try { ts = await oapi('timesheet', { storeId: 'ALL', weekStart: OFF.home.today }); } catch (e) { $('#offBody').innerHTML = '<div class="oempty">' + esc(e.message) + '</div>'; return; }
  if (OFF.tab !== 'today') return;
  const t = OFF.home.today;
  const ppl = {}; OFF.home.people.forEach(p => ppl[p.id] = p);
  const groups = {};
  ts.rows.forEach(r => {
    const d = r.days.find(x => x.date === t);
    if (!d) return; // Sunday
    (groups[r.storeId || '—'] = groups[r.storeId || '—'] || []).push({ r, d, p: ppl[r.id] || {} });
  });
  const ids = Object.keys(groups).sort((a, b) => storeName(a).localeCompare(storeName(b)));

          (d.firstIn ? 'In ' + esc(d.firstIn) : 'No clock-in') + (d.lastOut ? ' · Out ' + esc(d.lastOut) : '') + (d.schedule ? ' · Scheduled ' + esc(d.schedule) : '') + '</div><div style="margin-left:16px">' + pills + '</div></div>' +

}

    catch (e) { toast(e.message, 4000); }

function csv(ts) {
  const lines = [['Week', 'Store', 'Employee ID', 'Name', 'Date', 'Day', 'First In', 'Last Out', 'Hours', 'Scheduled', 'Late (min)', 'Left Early (min)', 'Flags']];
  ts.rows.forEach(r => r.days.forEach(d => lines.push([ts.week, r.storeId, r.id, r.name, d.date, d.dow, d.firstIn, d.lastOut, d.hours, d.schedule, d.lateMin || '', d.earlyMin || '', d.flags.join('; ')])));
  ts.rows.forEach(r => lines.push([ts.week, r.storeId, r.id, r.name, 'WEEK TOTAL', '', '', '', r.totalHours, '', '', '', '']));
  const text = lines.map(l => l.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = (ts.weekStart + ' timesheet week ' + ts.week + ' ' + ts.storeId + '.csv');
  document.body.appendChild(a); a.click(); a.remove();
}

    };
  };
  $('#offBody').querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Tap again to remove'; return; }
    try { await oapi('revokeDevice', { deviceId: b.dataset.rv }); toast('Removed'); officeLoad(); } catch (e) { toast(e.message, 4000); }
  });
}

/* ---------------- self-update ----------------
   The backend tells every response which app version is current. When it differs, or once a night
   at 3 AM, the app reloads itself — but only when the screen is idle (no PIN pad or form open).
   The service worker fetches app files from the network first, so a reload always gets the newest. */
let lastNightly = new Date().toDateString();
setInterval(() => {
  const idle = !$('#layer').innerHTML && $('#office').classList.contains('hidden');
  const now = new Date();
  const nightly = now.getHours() === 3 && lastNightly !== now.toDateString();
  if (idle && (NEEDS_UPDATE || nightly)) { lastNightly = now.toDateString(); location.reload(); }
}, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && store.get('p1.device') && !$('#kiosk').classList.contains('hidden')) loadRoster(true); });

/* =====================================================================
   boot
   ===================================================================== */
LOGO.setAttribute('d', LOGO_D);
$('#markPath1').setAttribute('d', MARK_D); $('#markPath2').setAttribute('d', MARK_D);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
(function boot() {
  let t = ''; try { t = sessionStorage.getItem('p1.office') || ''; } catch (e) {}
  if (t) { OFF.token = t; show('office'); officeLoad(); return; }
  if (store.get('p1.device')) startKiosk(); else show('setup');
})();
</script>
